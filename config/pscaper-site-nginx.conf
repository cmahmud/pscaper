# Dashboard/exports: allowlisted read-only routes only. No management API exposure.
limit_req_zone $binary_remote_addr zone=pscaper_public_api:4m rate=30r/m;
limit_req_zone $binary_remote_addr zone=pscaper_stream_api:4m rate=120r/m;
limit_req_zone $binary_remote_addr zone=pscaper_telemetry:4m rate=240r/m;
server {
  listen 80;
  server_name proxy.syndrid.com;
  access_log off;
  include /home/ubuntu/pscaper/config/cloudflare-realip.conf;
  limit_req_status 429;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types application/json text/plain;
  location ^~ /.well-known/acme-challenge/ {
    proxy_pass http://127.0.0.1:8788;
    proxy_set_header Host $host;
  }
  location = / { proxy_pass http://127.0.0.1:8788; proxy_set_header Host $host; }
  location = /index.html { return 301 /; }
  location = /api/live { limit_req zone=pscaper_telemetry burst=30 nodelay;
    proxy_pass http://127.0.0.1:8788;
    proxy_set_header Host $host;
  }
  location = /api/history { limit_req zone=pscaper_telemetry burst=30 nodelay;
    proxy_pass http://127.0.0.1:8788;
    proxy_set_header Host $host;
  }
  location = /api/sources { limit_req zone=pscaper_telemetry burst=30 nodelay; proxy_pass http://127.0.0.1:8788; proxy_set_header Host $host; }
  location = /api/events { limit_req zone=pscaper_stream_api burst=30 nodelay; proxy_pass http://127.0.0.1:8788; proxy_set_header Host $host; }
  location = /api/asn { limit_req zone=pscaper_telemetry burst=20 nodelay; proxy_pass http://127.0.0.1:8788; proxy_set_header Host $host; }
  location = /api/v2/proxies {
    limit_req zone=pscaper_public_api burst=12 nodelay;
    proxy_pass http://127.0.0.1:8788;
    proxy_set_header Host $host;
  }
  location = /api/v2/quality {
    limit_req zone=pscaper_telemetry burst=30 nodelay;
    proxy_pass http://127.0.0.1:8788;
    proxy_set_header Host $host;
  }
  location = /api/v2/intelligence {
    limit_req zone=pscaper_telemetry burst=30 nodelay;
    proxy_pass http://127.0.0.1:8788;
    proxy_set_header Host $host;
  }
  location = /api/v2/health {
    limit_req zone=pscaper_telemetry burst=30 nodelay;
    proxy_pass http://127.0.0.1:8788;
    proxy_set_header Host $host;
  }
  location = /api/v1/proxies {
    limit_req zone=pscaper_public_api burst=12 nodelay;
    proxy_pass http://127.0.0.1:8788;
    proxy_set_header Host $host;
  }
  location = /pool/stats.json { proxy_pass http://127.0.0.1:8788; }
  location ^~ /pool/ {
    proxy_pass http://127.0.0.1:8788;
    proxy_set_header Host $host;
  }
  location / { return 404; }
}
server {
  listen 443 ssl;
  server_name proxy.syndrid.com;
  ssl_certificate /home/ubuntu/pscaper/data/letsencrypt/live/proxy.syndrid.com/fullchain.pem;
  ssl_certificate_key /home/ubuntu/pscaper/data/letsencrypt/live/proxy.syndrid.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  access_log off;
  include /home/ubuntu/pscaper/config/cloudflare-realip.conf;
  limit_req_status 429;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types application/json text/plain;
  location = / { proxy_pass http://127.0.0.1:8788; proxy_set_header Host $host; }
  location = /index.html { return 301 /; }
  location = /api/live { limit_req zone=pscaper_telemetry burst=30 nodelay; proxy_pass http://127.0.0.1:8788; proxy_set_header Host $host; }
  location = /api/history { limit_req zone=pscaper_telemetry burst=30 nodelay; proxy_pass http://127.0.0.1:8788; proxy_set_header Host $host; }
  location = /api/sources { limit_req zone=pscaper_telemetry burst=30 nodelay; proxy_pass http://127.0.0.1:8788; proxy_set_header Host $host; }
  location = /api/events { limit_req zone=pscaper_stream_api burst=30 nodelay; proxy_pass http://127.0.0.1:8788; proxy_set_header Host $host; }
  location = /api/asn { limit_req zone=pscaper_telemetry burst=20 nodelay; proxy_pass http://127.0.0.1:8788; proxy_set_header Host $host; }
  location = /api/v2/proxies {
    limit_req zone=pscaper_public_api burst=12 nodelay;
    proxy_pass http://127.0.0.1:8788;
    proxy_set_header Host $host;
  }
  location = /api/v2/quality {
    limit_req zone=pscaper_telemetry burst=30 nodelay;
    proxy_pass http://127.0.0.1:8788;
    proxy_set_header Host $host;
  }
  location = /api/v2/intelligence {
    limit_req zone=pscaper_telemetry burst=30 nodelay;
    proxy_pass http://127.0.0.1:8788;
    proxy_set_header Host $host;
  }
  location = /api/v2/health {
    limit_req zone=pscaper_telemetry burst=30 nodelay;
    proxy_pass http://127.0.0.1:8788;
    proxy_set_header Host $host;
  }
  location = /api/v1/proxies {
    limit_req zone=pscaper_public_api burst=12 nodelay;
    proxy_pass http://127.0.0.1:8788;
    proxy_set_header Host $host;
  }
  location = /pool/stats.json { proxy_pass http://127.0.0.1:8788; }
  location ^~ /pool/ { proxy_pass http://127.0.0.1:8788; proxy_set_header Host $host; }
  location / { return 404; }
}
