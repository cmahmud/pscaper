# Public-IP-only probe gateway. Existing named virtual hosts are unaffected.
server {
    listen 80;
    server_name 129.213.12.22;
    access_log off;
    location ^~ /probe/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Connection close;
        proxy_pass_request_headers off;
        proxy_read_timeout 6s;
    }
    location / { return 404; }
}
server {
    listen 443 ssl;
    server_name 129.213.12.22;
    ssl_certificate /home/ubuntu/pscaper/data/tls/probe.crt;
    ssl_certificate_key /home/ubuntu/pscaper/data/tls/probe.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    location ^~ /probe/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Connection close;
        proxy_pass_request_headers off;
        proxy_read_timeout 6s;
    }
    location / { return 404; }
}
